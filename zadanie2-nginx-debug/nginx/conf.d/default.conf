log_format lesson21 '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout lesson21;
    error_log /dev/stderr warn;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /error500 {
        return 500;
    }

    location = /log-volume-note {
        default_type text/plain;
        return 200 "Named volume lesson21_nginx_logs is mounted at /host-logs for host-side log storage examples.\n";
    }
}
